<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">
        <!-- ШАПКА САЙТА -->
        <div id="header">
            <div class="logo">
                <span class="logo-main">RESIDENT EVIL</span>
                <span class="logo-sub">АРХИВ</span>
            </div>
        </div>

        <!-- НАВИГАЦИЯ -->
        <div id="navbar">
            <a href="#" onclick="loadPage('home')">ГЛАВНАЯ</a> |
            <a href="#" onclick="loadPage('timeline')">ХРОНОЛОГИЯ</a> |
            <a href="#" onclick="loadPage('achievements')">ДОСТИЖЕНИЯ</a> |
            <a href="#" onclick="loadPage('contacts')">КОНТАКТЫ</a>
        </div>

        <!-- ОСНОВНОЙ КОНТЕНТ (IFRAME) -->
        <div id="main">
            <iframe id="content-frame" src="pages/home.html" style="width:100%; height:560px; border:none;"></iframe>
        </div>

        <!-- ПОДВАЛ -->
        <div id="footer">
            &copy; 2026 RESIDENT EVIL ARCHIVE. RETROACHIEVEMENTS.ORG
        </div>
    </div>

    <script>
