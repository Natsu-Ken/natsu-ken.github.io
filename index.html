<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">
        <!-- ШАПКА САЙТА -->
        <div id="header">
            <div class="logo">
                <span class="logo-main">RESIDENT EVIL</span>
                <span class="logo-sub">АРХИВ</span>
            </div>
            <div class="tagline">ДОБРО ПОЖАЛОВАТЬ В АРХИВ RESIDENT EVIL</div>
        </div>

        <!-- НАВИГАЦИЯ -->
        <div id="navbar">
            <a href="#" onclick="loadPage('home')">ГЛАВНАЯ</a> |
            <a href="#" onclick="loadPage('games')">ИГРЫ</a> |
            <a href="#" onclick="loadPage('achievements')">ДОСТИЖЕНИЯ</a> |
            <a href="#" onclick="loadPage('community')">СООБЩЕСТВО</a>
        </div>

        <!-- ОСНОВНОЙ КОНТЕНТ (IFRAME) -->
        <div id="main">
            <iframe id="content-frame" src="pages/home.html" style="width:100%; height:530px; border:none;"></iframe>
        </div>

        <!-- ПОДВАЛ -->
        <div id="footer">
            &copy; 2026 RESIDENT EVIL ARCHIVE. RETROACHIEVEMENTS.ORG
        </div>
    </div>

    <script>
        function loadPage(page) {
            const frame = document.getElementById('content-frame');
            
            if (page === 'home') {
            frame.src = 'pages/home.html';
        } else if (page === 'arcade') {
            frame.src = 'pages/arcade.html';
        } else if (page === 'gunsur2') {           // ← ПЕРЕИМЕНОВАНО
            frame.src = 'games/gunsur2.html';      // ← НОВОЕ ИМЯ ФАЙЛА
        } else if (page === 'games') {
            frame.src = 'pages/games.html';
        } else if (page === 'achievements') {
            frame.src = 'pages/achievements.html';
        } else if (page === 'community') {
            frame.src = 'pages/community.html';
            }
        }
    </script>

</body>
</html>
