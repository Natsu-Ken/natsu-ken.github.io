<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Resident Evil Archive - Nintendo 64</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { 
            background: transparent; 
            font-family: Arial, Helvetica, sans-serif;
            padding: 0;
            margin: 0;
        }

        .n64-page {
            background-color: #D0D0D0;
            border: 2px inset #808080;
            padding: 15px;
        }

        .n64-page h1 {
            font-size: 22px;
            color: #000000;
            border-bottom: 2px solid #808080;
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
        }

        .platform-header-icon {
            width: 32px;
            height: 32px;
            vertical-align: middle;
            margin-right: 8px;
            object-fit: contain;
        }
        
        .n64-page .platform-description {
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }

        .game-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .game-list li {
            padding: 10px 0;
            border-bottom: 1px solid #808080;
            text-align: center;
        }

        .game-list li:last-child {
            border-bottom: none;
        }

        .game-list li a {
            color: #0000FF;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .game-list li a:hover {
            color: #FF0000;
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #808080;
        }

        .back-link a {
            color: #0000FF;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            color: #FF0000;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="n64-page">
        <h1>
            <img src="../images/icons/n64.png" alt="Nintendo 64" class="platform-header-icon">
            NINTENDO 64
        </h1>
        <p class="platform-description">Игры для платформы Nintendo 64, поддерживаемые RetroAchievements.</p>
        
        <ul class="game-list">
            <li>
                <a href="#" onclick="parent.loadPage(event, 're2n64')">Resident Evil 2</a>
            </li>
        </ul>
        
        <div class="back-link">
            <a href="#" onclick="parent.loadPage(event, 'home')">← Вернуться к списку платформ</a>
        </div>
    </div>

</body>
</html>
