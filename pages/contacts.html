<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Resident Evil Archive - Контакты</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { 
            background: transparent; 
            font-family: Arial, Helvetica, sans-serif;
            padding: 0;
            margin: 0;
        }

        .contacts-page {
            background-color: #D0D0D0;
            border: 2px inset #808080;
            padding: 15px;
        }

        .contacts-page h1 {
            font-size: 22px;
            color: #000000;
            border-bottom: 2px solid #808080;
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
        }

        .contacts-page .description {
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        .contacts-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: center;
        }

        .contacts-list li {
            padding: 12px 0;
            border-bottom: 1px solid #808080;
            font-size: 15px;
        }

        .contacts-list li:last-child {
            border-bottom: none;
        }

        .contacts-list a {
            color: #0000FF;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        .contacts-list a:hover {
            color: #FF0000;
            text-decoration: underline;
        }

        .contacts-list .social-icon {
            font-size: 24px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #808080;
        }

        .back-link a {
            color: #0000FF;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            color: #FF0000;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="contacts-page">
        <h1>📬 КОНТАКТЫ</h1>
        <p class="description">Связаться со мной можно через любую из этих платформ:</p>

        <ul class="contacts-list">
            <li>
                <span class="social-icon">📱</span>
                <a href="https://t.me/natsu_ken" target="_blank">Telegram</a>
            </li>
            <li>
                <span class="social-icon">💬</span>
                <a href="https://discord.gg/CaTeve6" target="_blank">Discord</a>
            </li>
            <li>
                <span class="social-icon">🕹️</span>
                <a href="https://steamcommunity.com/id/natsu-ken/" target="_blank">Steam</a>
            </li>
            <li>
                <span class="social-icon">📺</span>
                <a href="https://www.twitch.tv/natsuxken" target="_blank">Twitch</a>
            </li>
        </ul>

        <div class="back-link">
            <a href="#" onclick="parent.loadPage('home')">← Вернуться на главную</a>
        </div>
    </div>

</body>
</html>
